<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'none'" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>PhuCholony Integrator (Itch.io)</title>
  </head>
  <body>
    <script>
      /**
       * Bootstrap Oauth Provider
       * @return {Promise<string[2]>} Access Token Claim from Itch.io
       */
      async function bootstrap() {
        return new Promise((resolve, reject) => {
          const localCsrfToken = window.localStorage.getItem('csrf-token')
          if (!localCsrfToken)
            reject('csrf token does not exist in local storage!')

          const queryString = window.location.hash.slice(1)
          const params = new URLSearchParams(queryString)

          const csrfToken = params.get('state')
          if (!csrfToken) reject('csrf token does not exist in query string!')

          if (csrfToken != localCsrfToken) reject('csrf token does not match!')

          const accessToken = params.get('access_token')
          accessToken
            ? resolve([accessToken, csrfToken])
            : reject('access_token hash query string does not provide!')
        })
      }

      bootstrap()
        .then(([accessToken, csrfToken]) => {
          const headers = new Headers()
          headers.append('Content-Type', 'application/json')
          headers.append('Authorization', `Bearer ${accessToken}`)

          fetch('http://localhost:3000/auth/grant', {
            method: 'POST',
            headers,
            body: JSON.stringify({ csrfToken }),
            credentials: 'include',
          })
            .then((response) => JSON.parse(response))
            .then((response) => console.info(response))
            .catch((err) => console.error(err))
        })
        .catch((err) => console.error(err))
        .finally(() => {})
    </script>
  </body>
</html>
